<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Corio</title>
<meta property="og:title" content="Corio — Recovery & Training" id="og-title">
<meta property="og:description" content="HRV, сон, тренування — у тебе в кишені." id="og-desc">
<meta property="og:type" content="website">
<meta property="og:image" content="https://apps.apple.com/assets/web/app-store-app-icon.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
  background:#0a0b0f;color:#fff;
  display:flex;align-items:center;justify-content:center;
  padding:24px;min-height:100dvh;
}
.card{max-width:380px;width:100%;text-align:center}
.logo{
  width:80px;height:80px;margin:0 auto 24px;
  border-radius:22px;
  background:linear-gradient(135deg,#818CF8 0%,#A78BFA 50%,#4ADE80 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:700;color:#0a0b0f;
  box-shadow:0 8px 40px rgba(167,139,250,0.35);
}
h1{font-size:24px;font-weight:600;margin-bottom:8px;letter-spacing:-0.02em}
p.subtitle{color:rgba(255,255,255,0.6);font-size:15px;line-height:1.5;margin-bottom:32px}
.btn{
  display:block;width:100%;padding:16px;border-radius:14px;
  font-size:16px;font-weight:600;text-decoration:none;margin-bottom:12px;
  transition:transform 0.1s;
}
.btn:active{transform:scale(0.98)}
.btn-primary{background:#fff;color:#0a0b0f}
.btn-secondary{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.12)}
.spinner{
  width:24px;height:24px;margin:16px auto 0;
  border:2px solid rgba(255,255,255,0.1);
  border-top-color:#A78BFA;border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
small{color:rgba(255,255,255,0.35);font-size:12px;display:block;margin-top:24px}
.hide{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">F</div>
  <h1 id="title">Corio</h1>
  <p class="subtitle" id="subtitle">HRV, сон, тренування — у тебе в кишені.</p>
  <a class="btn btn-primary" id="open-app" href="https://apps.apple.com/app/id6766167022">Скачати в App Store</a>
  <a class="btn btn-secondary hide" id="open-app2" href="#">Відкрити в Corio</a>
  <div class="spinner hide" id="spin"></div>
  <small id="hint"></small>
</div>
<script>
(function(){
  var SUPABASE_URL = "https://bflphlugwtzlobsvhhot.supabase.co";
  var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmbHBobHVnd3R6bG9ic3ZoaG90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM0NzIwODQsImV4cCI6MjA2OTA0ODA4NH0.skul2bpkHg_TyP5JmtBBqRm3i2KG-E8-4IO4h4mcRP0";
  var APP_STORE = "https://apps.apple.com/app/id6766167022";

  var path = window.location.pathname;
  var deepLink = null;
  var profileMatch = path.match(/^\/profile\/([^\/]+)\/?$/);
  var inviteMatch = path.match(/^\/invite\/([^\/]+)\/?$/);

  var titleEl = document.getElementById('title');
  var subEl = document.getElementById('subtitle');
  var openBtn = document.getElementById('open-app');
  var openBtn2 = document.getElementById('open-app2');
  var spin = document.getElementById('spin');
  var hint = document.getElementById('hint');
  var ogTitle = document.getElementById('og-title');
  var ogDesc = document.getElementById('og-desc');

  function showFallback(){
    spin.classList.add('hide');
    hint.textContent = "Якщо нічого не сталось — установи Corio";
  }

  function handleProfile(username){
    deepLink = "forma://profile/" + encodeURIComponent(username);
    titleEl.textContent = "@" + username;
    subEl.textContent = "Дивись recovery, сон і тренування у Corio.";
    ogTitle.setAttribute('content', "@" + username + " on Corio");
    ogDesc.setAttribute('content', "Дивись recovery, сон і тренування @" + username + " у Corio.");
    fetch(SUPABASE_URL + "/rest/v1/users?username=eq." + encodeURIComponent(username) + "&select=display_name&limit=1",
      { headers: { apikey: SUPABASE_ANON, Authorization: "Bearer " + SUPABASE_ANON } })
      .then(function(r){ return r.json(); })
      .then(function(rows){
        if (rows && rows[0] && rows[0].display_name) {
          titleEl.textContent = rows[0].display_name;
          ogTitle.setAttribute('content', rows[0].display_name + " on Corio");
        }
      }).catch(function(){});
  }

  function handleInvite(code){
    deepLink = "forma://invite/" + encodeURIComponent(code);
    titleEl.textContent = "Тебе запрошують у Corio";
    subEl.textContent = "HRV, сон, тренування, порівняння з друзями.";
    ogTitle.setAttribute('content', "Запрошення в Corio");
    ogDesc.setAttribute('content', "Тебе запрошують в Corio — recovery & training app.");
  }

  if (profileMatch) handleProfile(decodeURIComponent(profileMatch[1]));
  else if (inviteMatch) handleInvite(decodeURIComponent(inviteMatch[1]));

  if (!deepLink) return; // not a known route — index App Store CTA stays

  document.title = titleEl.textContent + " — Corio";
  openBtn.textContent = "Скачати в App Store";
  openBtn.href = APP_STORE;
  openBtn2.href = deepLink;
  openBtn2.textContent = "Відкрити в Corio";
  openBtn2.classList.remove('hide');

  // iOS auto-redirect attempt
  var ua = navigator.userAgent || "";
  var isIOS = /iPad|iPhone|iPod/.test(ua);
  if (isIOS) {
    spin.classList.remove('hide');
    var t = Date.now();
    window.location.href = deepLink;
    setTimeout(function(){
      if (Date.now() - t < 2500 && !document.hidden) {
        window.location.href = APP_STORE;
      } else {
        showFallback();
      }
    }, 1500);
  } else {
    hint.textContent = "Установи Corio на iPhone щоб відкрити цей лінк";
  }
})();
</script>
</body>
</html>
